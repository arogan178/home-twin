[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "home-twin"
version = "0.1.0"
description = "An AI-accessible, open-source digital twin for residential buildings."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Home Twin contributors" }]
dependencies = [
  "fastapi>=0.116,<1",
  "ifcopenshell>=0.8.5,<0.9",
  "mcp>=1.26,<2",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6.0.2,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
ifcmcp = ["ifcopenshell-mcp>=0.8.5,<0.9"]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<0.15",
]

[project.scripts]
home-twin = "home_twin.cli:main"
home-twin-mcp = "home_twin.mcp_server:main"
home-twin-ui = "home_twin.ui_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/home_twin"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Each module skips itself before importing the owner's private scripts.
"tests/personal/*" = ["E402"]
